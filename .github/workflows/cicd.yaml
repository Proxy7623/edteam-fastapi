name: EDTEAM FastAPI Demo

on:
  push:
    branches:
      - master
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest test/test.py


      - name: docker build
        run: |
          docker build -t ${{secrets.DOCKER_USERNAME}}/edteam-fastapi:${{ github.sha }} . 

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}    
      - name: docker push
        run: docker push ${{secrets.DOCKER_USERNAME}}/edteam-fastapi:${{ github.sha }}

